<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="小页是一款手机优先、离线可用的本地记事本。">
  <meta name="theme-color" content="#f6f2e8">
  <title>小页记事本</title>
  <script>document.documentElement.classList.add("js");</script>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-192.png">
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-logo" viewBox="0 0 32 32">
      <rect x="5" y="4" width="20" height="24" rx="4"></rect>
      <path d="M10 10h10M10 15h10M10 20h7"></path>
      <path d="M20 4h5v8h-5z"></path>
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="6.5"></circle>
      <path d="m16 16 4 4"></path>
    </symbol>
    <symbol id="icon-x" viewBox="0 0 24 24">
      <path d="m6 6 12 12M18 6 6 18"></path>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14"></path>
    </symbol>
    <symbol id="icon-more" viewBox="0 0 24 24">
      <circle cx="5" cy="12" r="1"></circle>
      <circle cx="12" cy="12" r="1"></circle>
      <circle cx="19" cy="12" r="1"></circle>
    </symbol>
    <symbol id="icon-back" viewBox="0 0 24 24">
      <path d="m15 5-7 7 7 7"></path>
    </symbol>
    <symbol id="icon-pin" viewBox="0 0 24 24">
      <path d="m8 4 8 8-2 2 3 3-1.5 1.5-3-3-2 2-8-8L4 7l3-3Z"></path>
      <path d="m10 14-6 6"></path>
    </symbol>
    <symbol id="icon-share" viewBox="0 0 24 24">
      <path d="M12 15V3M8 7l4-4 4 4"></path>
      <path d="M5 12v7h14v-7"></path>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24">
      <path d="M4 7h16M9 7V4h6v3M7 7l1 13h8l1-13M10 11v5M14 11v5"></path>
    </symbol>
    <symbol id="icon-download" viewBox="0 0 24 24">
      <path d="M12 4v11M8 11l4 4 4-4"></path>
      <path d="M5 19h14"></path>
    </symbol>
    <symbol id="icon-smartphone" viewBox="0 0 24 24">
      <rect x="7" y="3" width="10" height="18" rx="2"></rect>
      <path d="M10 6h4M11 18h2"></path>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="m5 12 4 4 10-10"></path>
    </symbol>
  </svg>

  <div class="app-shell" id="appShell">
    <section class="screen home-screen is-active" id="homeView" aria-labelledby="appTitle">
      <header class="app-header">
        <div class="brand">
          <svg class="brand-icon" aria-hidden="true"><use href="#icon-logo"></use></svg>
          <div>
            <h1 id="appTitle">小页</h1>
            <p>离线记事本</p>
          </div>
        </div>
        <button class="icon-button" id="homeMenuButton" type="button" aria-label="更多选项" aria-haspopup="dialog">
          <svg aria-hidden="true"><use href="#icon-more"></use></svg>
        </button>
      </header>

      <main class="home-main" id="homeMain">
        <section class="today-block" aria-labelledby="todayHeading">
          <p class="today-label" id="todayLabel"></p>
          <h2 id="todayHeading">今天想记点什么？</h2>
        </section>

        <label class="search-field" for="searchInput">
          <svg aria-hidden="true"><use href="#icon-search"></use></svg>
          <span class="visually-hidden">搜索笔记</span>
          <input id="searchInput" type="search" inputmode="search" autocomplete="off" placeholder="搜索标题和正文">
          <button class="search-clear" id="clearSearchButton" type="button" aria-label="清除搜索" hidden>
            <svg aria-hidden="true"><use href="#icon-x"></use></svg>
          </button>
        </label>

        <div class="filter-row" role="group" aria-label="筛选笔记">
          <button class="filter-chip is-selected" type="button" data-filter="all" aria-pressed="true">全部</button>
          <button class="filter-chip" type="button" data-filter="pinned" aria-pressed="false">
            <svg aria-hidden="true"><use href="#icon-pin"></use></svg>
            置顶
          </button>
        </div>

        <div class="list-heading">
          <h2 id="listTitle">最近笔记</h2>
          <span id="noteCount" aria-live="polite">0 条</span>
        </div>

        <div class="note-list" id="noteList"></div>

        <section class="empty-state" id="emptyState" hidden>
          <span class="empty-icon" aria-hidden="true">
            <svg><use href="#icon-logo"></use></svg>
          </span>
          <h2 id="emptyTitle">这里还没有笔记</h2>
          <p id="emptyCopy">把刚想到的、要做到的，先写下来。</p>
          <button class="secondary-button" id="emptyNewButton" type="button">
            <svg aria-hidden="true"><use href="#icon-plus"></use></svg>
            写第一条
          </button>
        </section>
      </main>

      <footer class="home-footer">
        <p>
          <svg aria-hidden="true"><use href="#icon-check"></use></svg>
          自动保存在这台设备上
        </p>
        <button class="primary-button" id="newNoteButton" type="button">
          <svg aria-hidden="true"><use href="#icon-plus"></use></svg>
          新笔记
        </button>
      </footer>
    </section>

    <section class="screen editor-screen" id="editorView" aria-labelledby="editorTitle" aria-hidden="true" inert>
      <header class="editor-header">
        <button class="icon-button" id="backButton" type="button" aria-label="返回笔记列表">
          <svg aria-hidden="true"><use href="#icon-back"></use></svg>
        </button>
        <p class="save-status" id="saveStatus" role="status" aria-live="polite">已保存</p>
        <button class="icon-button" id="noteMenuButton" type="button" aria-label="当前笔记的更多选项" aria-haspopup="dialog">
          <svg aria-hidden="true"><use href="#icon-more"></use></svg>
        </button>
      </header>

      <main class="editor-main">
        <input class="note-title-input" id="noteTitle" type="text" maxlength="100" autocomplete="off" placeholder="标题" aria-label="笔记标题">
        <textarea class="note-content-input" id="noteContent" maxlength="100000" placeholder="从这里开始写…" aria-label="笔记正文" spellcheck="true"></textarea>
      </main>

      <footer class="editor-footer">
        <button class="tool-button" id="pinButton" type="button" aria-pressed="false">
          <svg aria-hidden="true"><use href="#icon-pin"></use></svg>
          <span>置顶</span>
        </button>
        <fieldset class="color-picker">
          <legend class="visually-hidden">笔记颜色</legend>
          <button class="color-dot color-dot--paper" type="button" data-color="paper" aria-label="纸色" aria-pressed="true"></button>
          <button class="color-dot color-dot--mint" type="button" data-color="mint" aria-label="薄荷色" aria-pressed="false"></button>
          <button class="color-dot color-dot--oat" type="button" data-color="oat" aria-label="燕麦色" aria-pressed="false"></button>
          <button class="color-dot color-dot--rose" type="button" data-color="rose" aria-label="浅粉色" aria-pressed="false"></button>
          <button class="color-dot color-dot--blue" type="button" data-color="blue" aria-label="浅蓝色" aria-pressed="false"></button>
        </fieldset>
        <button class="tool-button" id="shareNoteButton" type="button">
          <svg aria-hidden="true"><use href="#icon-share"></use></svg>
          <span>分享</span>
        </button>
      </footer>
    </section>
  </div>

  <div class="sheet-layer" id="actionSheet" hidden>
    <button class="sheet-backdrop" type="button" data-close-sheet aria-label="关闭菜单"></button>
    <section class="bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" tabindex="-1">
      <span class="sheet-handle" aria-hidden="true"></span>
      <h2 id="sheetTitle">更多选项</h2>
      <div class="sheet-actions" id="sheetActions"></div>
      <button class="sheet-cancel" type="button" data-close-sheet>取消</button>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden>
    <span id="toastMessage"></span>
    <button id="toastAction" type="button" aria-label="撤销" hidden></button>
  </div>

  <script src="./app.js" defer></script>
</body>
</html>
